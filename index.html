    <!-- ===== JSON-LD: FAQPage ===== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Cómo comprar tablas de skate al por mayor en Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Explora el catálogo por categoría (tablas, ejes, ruedas, rodamientos), selecciona los productos que necesitas y contáctanos por WhatsApp indicando las cantidades. Te respondemos con precio por volumen y disponibilidad real del inventario."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuáles marcas de skate están disponibles en el catálogo mayorista?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El catálogo 2026 incluye marcas reconocidas como Theories of Atlantis, Hopps, Trap Skateboards, Traffic Skateboards, Natural Konzepts, Feel Skateboards y Bolzen Trucks. Todo producto importado directamente, con inventario físico en bodega en Colombia."
          }
        },
        {
          "@type": "Question",
          "name": "¿El catálogo es solo para distribuidores o también para tiendas pequeñas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El catálogo es B2B: está dirigido a distribuidores, tiendas de skateboarding y puntos de reventa que quieren comprar por volumen al precio de importador. No se vende al detal."
          }
        },
        {
          "@type": "Question",
          "name": "¿Los productos tienen stock real o son preventa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Todo el inventario está físicamente en bodega en Colombia, ya nacionalizado. No es preventa ni encargo: el producto existe y puede despacharse una vez confirmado el pedido."
          }
        },
        {
          "@type": "Question",
          "name": "¿Hacen despacho a todo Colombia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Una vez confirmado el pedido, coordinamos el envío a tu ciudad o punto de retiro en cualquier parte del territorio colombiano."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuántas unidades mínimas se piden por categoría?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El pedido mínimo es de una caja por categoría (MOQ 5 unidades por caja). Las cajas llegan en surtido aleatorio de los modelos disponibles en bodega al momento del despacho."
          }
        }
      ]
    }
    </script>
